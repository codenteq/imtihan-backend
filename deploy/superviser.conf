[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:horizon]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan horizon
autostart=true
autorestart=true
user=root
redirect_stderr=true
stdout_logfile=/var/log/horizon.log

[program:octane]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan octane:start  --max-requests=500 --workers=10 --task-workers=6 --server=swoole --host=0.0.0.0 --port=8000
autostart=true
autorestart=true
user=root
redirect_stderr=true
stdout_logfile=/var/log/octane.log
